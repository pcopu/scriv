name: Verify Scriv
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      apple_silicon_runtime:
        description: Also run the native app on an Apple Silicon runner
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cloud:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm --prefix cloud ci
      - run: npm --prefix cloud run typecheck
      - run: npm --prefix cloud test
      - run: npm --prefix cloud run build
      - run: node scripts/check-repo.mjs
      - run: node --test tests/*.test.mjs
  peer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify real WebRTC image transfers
        run: npm run test:peer
  mac:
    strategy:
      fail-fast: false
      matrix:
        # Every required Mac job compiles both architectures and packages a
        # universal app. Apple Silicon execution is an additional on-demand job;
        # its public runner queue does not block the reproducible Intel gate.
        runner: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.apple_silicon_runtime && '["macos-15-intel","macos-26"]' || '["macos-15-intel"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test native core
        run: swift test --package-path apps/mac
      - name: Package the native app
        id: package
        env:
          SCRIV_UNIVERSAL: ${{ matrix.runner == 'macos-15-intel' && '1' || '0' }}
        run: bash scripts/build-mac.sh
      - name: Verify native WebKit peer transfer
        run: |
          mkdir -p build/peer-smoke
          open -n build/Scriv.app --args --peer-smoke "$PWD/build/peer-smoke"
          for attempt in $(seq 1 55); do
            if [ -f build/peer-smoke/error.txt ]; then cat build/peer-smoke/error.txt; exit 1; fi
            if [ -f build/peer-smoke/result.txt ]; then cat build/peer-smoke/result.txt; exit 0; fi
            sleep 1
          done
          echo 'Native WebKit transfer did not complete.' >&2
          exit 1
      - name: Render the three native views
        if: always() && steps.package.outcome == 'success'
        run: |
          mkdir -p build/screenshots
          open -n build/Scriv.app --args --screenshots "$PWD/build/screenshots"
          for attempt in $(seq 1 60); do
            if [ -f build/screenshots/error.txt ]; then cat build/screenshots/error.txt; exit 1; fi
            count=$(find build/screenshots -name '*.png' | wc -l | tr -d ' ')
            if [ "$count" -ge 3 ]; then exit 0; fi
            sleep 1
          done
          echo 'Native screenshots did not complete.' >&2
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scriv-${{ matrix.runner }}-build
          path: |
            build/Scriv-macOS.zip
            build/screenshots/*
            build/peer-smoke/*
          if-no-files-found: warn
